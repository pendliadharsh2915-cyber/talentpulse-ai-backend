services:
  - type: web
    name: talentpulse-ai-backend
    runtime: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: PORT
        value: 8080
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: talentpulse-db
          property: connectionString
      - key: APP_JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: "http://localhost:5173,https://*.vercel.app,https://*.onrender.com"
      - key: APP_SEED_DEMO_DATA
        value: "true"

databases:
  - name: talentpulse-db
    databaseName: jobportal
    user: talentpulse_user
    plan: free
    region: oregon
