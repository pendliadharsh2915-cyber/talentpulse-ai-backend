# Production Database Configuration (PostgreSQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/jobportal}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Disable H2 in production
spring.h2.console.enabled=false

# Initial demo data seed toggle (seeds demo accounts on fresh databases)
app.seed-demo-data=${APP_SEED_DEMO_DATA:true}

