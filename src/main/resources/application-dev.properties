# File-Based H2 Database for local development (persists to ./data/jobportaldb on disk)
spring.datasource.url=jdbc:h2:file:./data/jobportaldb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console enabled in dev profile
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Enable demo data seeding in dev profile (only seeds if database is empty)
app.seed-demo-data=true
