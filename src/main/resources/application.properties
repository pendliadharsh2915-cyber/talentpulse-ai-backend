spring.application.name=ai-job-portal
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Server config
server.port=${PORT:8080}

# File upload limits for resumes (5MB)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# JWT Configuration (HMAC-SHA256 256-bit key)
app.jwt.secret=${APP_JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

# Storage for resumes
app.upload.dir=${APP_UPLOAD_DIR:./uploads/resumes}

# CORS allowed origins (can be comma-separated or overridden by env var)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
